<h2>User List</h2>
<div class="user-list-container">
  @for (user of users$ | async; track user.id) {
    <mat-card class="user-card" (click)="onSelected(user.id)">
      <mat-card-header>
        <mat-card-title>User ID {{ user.id }}</mat-card-title>
      </mat-card-header> 
      <mat-card-content>
        {{ user.name }}
      </mat-card-content>
    </mat-card>
  }
</div>
